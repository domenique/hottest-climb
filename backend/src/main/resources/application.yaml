ktor:
  deployment:
    port: "$PORT:8080"
  application:
    modules:
      - be.hottestclimb.ApplicationKt.module

database:
  # Either a jdbc: url or a postgres://user:password@host/db connection string (Render, Heroku).
  url: "$DATABASE_URL:postgresql://hottestclimb:hottestclimb@localhost:5432/hottestclimb"
  # Only needed when the url carries no credentials.
  user: "$?DATABASE_USER"
  password: "$?DATABASE_PASSWORD"

admin:
  # "admin" for local development only. The Docker image sets ADMIN_PASSWORD to empty,
  # which disables the admin API until a real password is configured.
  password: "$ADMIN_PASSWORD:admin"
